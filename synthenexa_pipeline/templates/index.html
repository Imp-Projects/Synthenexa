<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthenexa Results</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --accent: #3b82f6;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
        }
        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card-title {
            padding: 15px 20px;
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: center;
            word-break: break-all;
        }
        .empty {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>SYNTHENEXA RESULTS</h1>

    {% if images %}
        <div class="gallery">
            {% for img in images %}
            <div class="card">
                <a href="/static/{{ img }}" target="_blank">
                    <img src="/static/{{ img }}" alt="{{ img }}">
                </a>
                <div class="card-title">{{ img }}</div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty">
            <h2>No analysis results found.</h2>
            <p>Run the pipeline and visualization scripts to generate charts.</p>
        </div>
    {% endif %}

</body>
</html>
