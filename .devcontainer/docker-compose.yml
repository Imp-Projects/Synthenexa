version: "3.8"
services:
  app:
    image: ghcr.io/imp-projects/synthenexa-devcontainer:latest
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/Synthenexa:cached
    command: sleep infinity
    environment:
      PYTHONPATH: /workspaces/Synthenexa/synthenexa_pipeline
      PYTHONDONTWRITEBYTECODE: "1"

