version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: synthenexa-postgres
    environment:
      POSTGRES_DB: synthenexa
      POSTGRES_USER: synthenexa
      POSTGRES_PASSWORD: synthenexa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthenexa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
